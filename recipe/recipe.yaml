schema_version: 1

context:
  name: env-repair
  version: "0.2.7"
  python_min: "3.9"
  sdist_name: ${{ name | replace("-", "_") }}
  pypi_first: ${{ name[0] }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ pypi_first }}/${{ name }}/${{ sdist_name }}-${{ version }}.tar.gz
  sha256: 6de7bb91b63fa50b6d59c51856066474be32f1f76200c7e2dd820edfd4b9aceb

build:
  number: 0
  noarch: python
  script:
    - if: win
      then: '"%PYTHON%" -m pip install . -vv --no-deps --no-build-isolation'
      else: '"${PYTHON}" -m pip install . -vv --no-deps --no-build-isolation'
  python:
    entry_points:
      - env-repair = env_repair.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - env_repair
      pip_check: true
  - script:
      - env-repair --help

about:
  license: MIT
  license_file: LICENSE
  summary: Scan and repair venv/virtualenv/conda/mamba/micromamba/miniforge environments with mixed conda/pip installs.
  homepage: https://github.com/noragen/env-repair

extra:
  recipe-maintainers:
    - noragen
